name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    # A repository's first push has an all-zero `before` SHA. TruffleHog needs
    # two distinct revisions, so skip that one event and scan later pushes/PRs.
    if: ${{ github.event_name != 'push' || github.event.before != github.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          head: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
