version: 2
project_name: devmesh

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: devmesh
    main: ./cmd/devmesh
    binary: devmesh
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: devmeshd
    main: ./cmd/devmeshd
    binary: devmeshd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: default
    ids: [devmesh, devmeshd]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

homebrew_casks:
  - name: devmesh
    ids: [default]
    binaries: [devmesh, devmeshd]
    description: "Stable local endpoints for ephemeral development service backends"
    homepage: "https://github.com/go-go-golems/devmesh"
    repository:
      owner: go-go-golems
      name: homebrew-go-go-go
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    url:
      verified: github.com/go-go-golems/devmesh/

nfpms:
  - id: packages
    vendor: GO GO GOLEMS
    homepage: https://github.com/go-go-golems/devmesh
    maintainer: Manuel Odendahl <wesen@ruinwesen.com>
    description: Stable local endpoints for ephemeral development service backends
    license: MIT
    formats: [deb, rpm]
    release: 1
    section: default
    priority: extra
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package

publishers:
  - name: fury.io
    ids: [packages]
    dir: "{{ dir .ArtifactPath }}"
    cmd: curl -F package=@{{ .ArtifactName }} https://{{ .Env.FURY_TOKEN }}@push.fury.io/go-go-golems/

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
